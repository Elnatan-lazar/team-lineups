<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>סידור הרכבים</title>
  <meta name="description" content="בניית הרכבים, חילופים וסטטיסטיקות לקבוצת כדורגל">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#games">⚽ <span id="teamName"></span></a>
    <nav>
      <a href="#games" data-v="games">משחקים</a>
      <a href="#stats" data-v="stats">סטטיסטיקה</a>
      <a href="#squad" data-v="squad">סגל</a>
    </nav>
    <span id="status" class="status"></span>
  </header>

  <main id="view"></main>

  <div id="modal" class="modal" hidden>
    <div class="modal-box" id="modalBox"></div>
  </div>
  <div id="toast" role="status"></div>

  <script src="app.js"></script>
</body>
</html>
